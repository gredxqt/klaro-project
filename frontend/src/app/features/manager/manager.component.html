<div class="container">
  <h1>Manager — All Requests</h1>

  <mat-card>
    <mat-card-content>
      <p *ngIf="requests.length === 0" class="empty">No requests found.</p>

      <table mat-table [dataSource]="requests" class="full-width">

        <ng-container matColumnDef="beneficiaryId">
          <th mat-header-cell *matHeaderCellDef>Beneficiary ID</th>
          <td mat-cell *matCellDef="let req">{{ req.beneficiaryId | slice:0:8 }}...</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let req">{{ req.category }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Amount</th>
          <td mat-cell *matCellDef="let req">{{ req.amount }}€</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let req">{{ req.description | slice:0:40 }}...</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let req">
            <mat-chip [color]="req.status === AidStatus.APPROVED ? '' :
                               req.status === AidStatus.REJECTED ? 'warn' : 'primary'" selected>
              {{ req.status }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let req">
            <mat-select placeholder="Change status"
              (selectionChange)="changeStatus(req.id, $event.value)"
              [disabled]="getAllowedTransitions(req.status).length === 0">
              <mat-option *ngFor="let s of getAllowedTransitions(req.status)" [value]="s">
                → {{ s }}
              </mat-option>
            </mat-select>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
